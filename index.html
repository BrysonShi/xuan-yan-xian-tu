<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>玄衍仙途：命运模拟器</title>
  <meta name="description" content="文字修仙模拟器 - 以命运为盘，以选择为子" />
</head>
<body>
  <!-- GitHub Pages SPA 路由恢复脚本 -->
  <script>
    (function () {
      var l = window.location;
      var basePath = '/xuan-yan-xian-tu/';
      // 从 404.html 重定向过来的路径恢复
      if (l.search) {
        var query = l.search.slice(1);
        var parts = query.split('&');
        var routePart = parts.find(function(p) { return p.indexOf('/') === 0; });
        if (routePart) {
          var route = decodeURIComponent(routePart.replace(/~and~/g, '&'));
          window.history.replaceState(null, null, basePath + route.slice(1) + l.hash);
        }
      }
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
